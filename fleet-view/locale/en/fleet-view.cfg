[mod-name]
fleet-view=Fleet View

[mod-description]
fleet-view=Shows your other space platforms in the background of the platform you are on.

[mod-setting-name]
fleet-view-detail=Building detail
fleet-view-float=Floating ships
fleet-view-smoothness=Float smoothness
fleet-view-parallax=Camera parallax
fleet-view-zoom-transfer=Zoom into ships

[mod-setting-description]
fleet-view-detail=Draw the buildings on distant ships. Turn off to draw only the floor shape and the lights.
fleet-view-float=Parked ships float gently around their spot. Turn off if the movement looks choppy on your screen.
fleet-view-smoothness=How often a floating ship is moved. Smooth (the default) moves it every tick and looks best. Balanced moves it about once a pixel at normal zoom and Light about every 4 pixels: steppier, but they cost less UPS when many big ships are in view. Only matters while Floating ships is on.
fleet-view-parallax=Background ships drift with the camera so they read as far away (subtle, medium or strong). Smooth while walking; a click-drag in remote view is only seen once you let go, so ships catch up after it. Off by default.
fleet-view-zoom-transfer=In remote view, zoom all the way in on a parked background ship to continue on that platform, at the same spot. Off by default.

[string-mod-setting]
fleet-view-smoothness-smooth=Smooth
fleet-view-smoothness-balanced=Balanced (less UPS)
fleet-view-smoothness-light=Light (least UPS)
fleet-view-parallax-off=Off
fleet-view-parallax-subtle=Subtle
fleet-view-parallax-medium=Medium
fleet-view-parallax-strong=Strong
